<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESnet — Logo Animation</title>
<style>
:root{
  --bg:#080B10;--panel:#0E141B;--line:#1D2632;--text:#E9EEF4;--muted:#7D8A99;
  --accent:#FF3694;--blue:#3890D6;--orange:#F48C2F;--green:#7AA154;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;overflow:hidden;color:var(--text);
  background:radial-gradient(125% 95% at 50% 0%,#111821 0%,#080B10 55%,#05070A 100%);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
}
#shell{height:100%;display:flex;flex-direction:column;min-height:0}
#stage-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:26px 28px 18px;min-height:0}
#stage-frame{
  position:relative;width:min(100%,calc((100vh - 190px)*16/9));aspect-ratio:16/9;
  background:#fff;border-radius:4px;overflow:hidden;cursor:pointer;
  box-shadow:0 34px 90px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.06);
}
#stage{display:block;width:100%;height:100%;background:transparent;position:relative;z-index:1}
#ui{flex:0 0 auto;padding:0 30px 24px;width:100%;max-width:1600px;margin:0 auto}
#topline{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:12px}
#chapters{display:flex;gap:6px;flex-wrap:wrap}
.chapter{
  appearance:none;border:1px solid transparent;background:transparent;color:var(--muted);
  font:600 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;
  padding:10px 12px;border-radius:3px;cursor:pointer;transition:color .2s,border-color .2s,background .2s;
}
.chapter:hover{color:var(--text);border-color:var(--line)}
.chapter.active{color:#fff;border-color:var(--line);background:#121923}
.chapter .dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:8px;vertical-align:1px;background:currentColor;opacity:.5}
.chapter[data-act="0"].active .dot{background:var(--accent);opacity:1}
.chapter[data-act="1"].active .dot{background:var(--orange);opacity:1}
.chapter[data-act="2"].active .dot{background:var(--blue);opacity:1}
.chapter[data-act="3"].active .dot{background:#BF2027;opacity:1}
.chapter[data-act="4"].active .dot{background:#3FBECF;opacity:1}
.chapter[data-act="5"].active .dot{background:#F37421;opacity:1}
.chapter[data-act="6"].active .dot{background:#DB3123;opacity:1}
.chapter[data-act="7"].active .dot{background:#C69214;opacity:1}
#time{font:500 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);letter-spacing:.08em;white-space:nowrap}
#track{height:2px;background:#1A222D;border-radius:2px;cursor:pointer;position:relative;margin-bottom:18px}
#progress{position:absolute;left:0;top:0;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--orange) 50%,var(--blue));border-radius:2px}
#track .tick{position:absolute;top:-3px;width:1px;height:8px;background:#2A3543}
#controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{
  appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--text);
  font:600 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em;
  padding:10px 14px;border-radius:3px;cursor:pointer;transition:background .2s,border-color .2s,color .2s;
}
.btn:hover{background:#151D27;border-color:#2A3543}
.btn.primary{background:#E9EEF4;color:#080B10;border-color:#E9EEF4}
.btn.primary:hover{background:#fff}
.btn[aria-pressed="true"]{border-color:var(--blue);color:#fff}
#styles{display:flex;align-items:center;gap:8px;border-left:1px solid var(--line);padding-left:12px;margin-left:4px}
#styles-label{font:600 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:#5E6B7A;letter-spacing:.12em;margin-right:2px}
#variation-select{
  appearance:none;border:1px solid var(--line);background-color:var(--panel);color:var(--text);
  font:600 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em;
  padding:9px 30px 9px 10px;border-radius:3px;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,#7D8A99 50%),linear-gradient(135deg,#7D8A99 50%,transparent 50%);
  background-position:calc(100% - 13px) 50%,calc(100% - 9px) 50%;
  background-size:4px 4px,4px 4px;background-repeat:no-repeat;
}
#variation-select:hover{border-color:#2A3543}
#hint{margin-left:auto;color:#5E6B7A;font:500 10px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.04em;text-align:right}
#hint b{color:#8B99A8;font-weight:600}
body.clean #ui{display:none}
body.clean #stage-wrap{padding:0}
body.clean #stage-frame{width:min(100vw,calc(100vh*16/9));max-height:100vh;border-radius:0;box-shadow:none}
#stage-frame:fullscreen{width:100vw;height:100vh;max-width:none;max-height:none;aspect-ratio:auto;border-radius:0;box-shadow:none;background:#fff;cursor:default}
#stage-frame:fullscreen #stage{width:100%;height:100%}
@media (max-width:720px){
  #stage-wrap{padding:12px 12px 8px}
  #ui{padding:0 14px 14px}
  #hint{display:none}
  .chapter{padding:9px 8px;letter-spacing:.08em}
  .btn{padding:9px 10px}
}
</style>
</head>

const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=t=>{t=clamp(t);return t*t*(3-2*t)};
const easeOut=t=>1-Math.pow(1-clamp(t),3);
const easeInOut=t=>{t=clamp(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
const easeOutBack=t=>{t=clamp(t);const c=1.45;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)};
const phase=(u,a,b)=>clamp((u-a)/(b-a));
const ellipseLen=(rx,ry)=>Math.PI*(3*(rx+ry)-Math.sqrt((3*rx+ry)*(rx+3*ry)));
const el=(tag,attrs={},parent)=>{const e=document.createElementNS(NS,tag);for(const[k,v]of Object.entries(attrs))e.setAttribute(k,v);if(parent)parent.appendChild(e);return e};

const setDash=(e,L,p)=>{e.style.strokeDasharray=String(L);e.style.strokeDashoffset=String(L*(1-clamp(p)))};

    setOp(esnet.spinGroup,smooth(phase(u,0.02,0.08))*(1-smooth(phase(u,0.32,0.42))));

    setOp(esnet.constGroup,0);

function resetActVariation(group){
  group.removeAttribute("transform");

function applyActVariation(group,actId,u,vi){
  resetActVariation(group);
  if(actId==="esnet"||vi===0||u<0.02||u>=0.46)return;
  if(vi===1){
    const p=easeInOut(phase(u,0.02,0.44));
    variation.irisCircle.setAttribute("r",(1200*p).toFixed(2));
    group.setAttribute("clip-path","url(#variation-iris)");
    const s=lerp(0.84,1,easeOut(phase(u,0.02,0.44)));
    setTransform(group,0,0,s,s,0,960,540);
  }else if(vi===2){
    const p=easeInOut(phase(u,0.03,0.38));
    const s=lerp(0.12,1,easeOutBack(phase(u,0.03,0.36)));
    const rot=-540*(1-p);
    setTransform(group,0,0,s,s,rot,960,540);
  }else if(vi===3){
    const p=easeInOut(phase(u,0.02,0.44));
    const y=1080*(1-p);

    variation.scanRect.setAttribute("height",(1080-y).toFixed(2));
    group.setAttribute("clip-path","url(#variation-scan)");
    variation.scanGlow.setAttribute("y1",y.toFixed(2));
    variation.scanGlow.setAttribute("y2",y.toFixed(2));
    variation.scanLine.setAttribute("y1",y.toFixed(2));
    variation.scanLine.setAttribute("y2",y.toFixed(2));

  }
}

    const c=el("circle",{cx:960,cy:540,r:0,fill:"none",stroke:i?"#F6A15E":"#DB3123","stroke-width":1.2,opacity:0},internet2.ringsGroup);
    internet2.rings.push({el:c});
  }
}
function renderInternet2(u){
  const finalFade=u<0.5?1:1-smooth(phase(u,0.62,0.94));
  setOp(internet2.place,finalFade);
  const swooshP=u<0.5?smooth(phase(u,0.04,0.24)):1-smooth(phase(u,0.68,0.88));
  setDash(internet2.ghost,internet2.swooshLen,swooshP);
  setOp(internet2.ghost,u<0.5?(1-smooth(phase(u,0.22,0.32))):smooth(phase(u,0.62,0.68))*(1-smooth(phase(u,0.90,0.96))));
  const fillP=u<0.5?smooth(phase(u,0.18,0.32)):1-smooth(phase(u,0.64,0.90));
  setOp(internet2.swoosh,fillP);
  for(let i=0;i<internet2.letters.length;i++){
    const el=internet2.letters[i];
    const p=u<0.5?smooth(phase(u,0.12+i*0.022,0.28+i*0.022)):1-smooth(phase(u,0.70+i*0.01,0.88+i*0.01));
    setOp(el,p);
    setTransform(el,0,20*(1-p),1,1,0,0,0);
  }
  const scanP=u<0.5?easeOut(phase(u,0.10,0.34)):1-easeOut(phase(u,0.70,0.90));
  const sx=(1004.1067*scanP).toFixed(2);
  internet2.scan.setAttribute("x1",sx);
  internet2.scan.setAttribute("x2",sx);
  const scanOp=smooth(phase(u,0.10,0.14))*(1-smooth(phase(u,0.34,0.40)));
  setOp(internet2.scan,scanOp*0.9);
  const pulseOp=Math.max(smooth(phase(u,0.08,0.14))*(1-smooth(phase(u,0.34,0.42))),smooth(phase(u,0.62,0.68))*(1-smooth(phase(u,0.90,0.96))));
  const t=(u*0.7+0.1)%1;
  const pt=internet2.ghost.getPointAtLength(t*internet2.swooshLen);
  internet2.pulse.setAttribute("cx",pt.x.toFixed(2));
  internet2.pulse.setAttribute("cy",pt.y.toFixed(2));
  setOp(internet2.pulse,pulseOp*0.9);
  const guideIn=smooth(phase(u,0.02,0.08));
  const guideOut=1-smooth(phase(u,0.30,0.38));
  const guideRev=smooth(phase(u,0.64,0.70))*(1-smooth(phase(u,0.88,0.94)));
  setOp(internet2.guidesGroup,Math.max(guideIn*guideOut,guideRev));
  const gd=u<0.5?easeOut(phase(u,0.03,0.24)):1-easeOut(phase(u,0.66,0.88));
  for(const g of internet2.guides)setDash(g.el,g.L,gd);
  const ringP=u<0.5?easeOut(phase(u,0.12,0.34)):1-easeOut(phase(u,0.68,0.88));
  const ringOp=smooth(phase(u,0.12,0.18))*(1-smooth(phase(u,0.34,0.40)))+smooth(phase(u,0.64,0.70))*(1-smooth(phase(u,0.88,0.94)));
  for(const r of internet2.rings){
    r.el.setAttribute("r",(430*ringP).toFixed(2));
    setOp(r.el,ringOp*0.35);
  }
  if(u>=0.46&&u<0.62){
    setOp(internet2.place,1);
    setOp(internet2.swoosh,1);
    for(const el of internet2.letters){setOp(el,1);el.removeAttribute("transform");}
    setOp(internet2.ghost,0);setOp(internet2.scan,0);setOp(internet2.pulse,0);
    setOp(internet2.guidesGroup,0);setOp(internet2.ringsGroup,0);
  }
}
function setupSDSC(){
  sdsc.place=document.getElementById("sdsc-place");
  sdsc.gold=[...document.querySelectorAll("#sdsc-svg .fil0")].sort((a,b)=>a.getBBox().x-b.getBBox().x);
  sdsc.blue=[...document.querySelectorAll("#sdsc-svg .fil1")].sort((a,b)=>a.getBBox().x-b.getBBox().x);
  sdsc.scan=document.getElementById("sdsc-scan");
  sdsc.rule=document.getElementById("sdsc-rule");
  sdsc.guidesGroup=document.getElementById("sdsc-guides");
  sdsc.guides=[];
  for(const y of [438.226,540,641.774]){
    const e=el("line",{x1:380,y1:y,x2:380,y2:y,stroke:"#DCE3EA","stroke-width":0.9},sdsc.guidesGroup);
    sdsc.guides.push({el:e,x:380,len:1160});
  }
}
function renderSDSC(u){
  const finalFade=u<0.5?1:1-smooth(phase(u,0.62,0.94));
  setOp(sdsc.place,finalFade);
  for(let i=0;i<sdsc.gold.length;i++){
    const el=sdsc.gold[i];
    const p=u<0.5?smooth(phase(u,0.06+i*0.018,0.22+i*0.018)):1-smooth(phase(u,0.68+i*0.01,0.88+i*0.01));
    setOp(el,p);
    setTransform(el,0,10*(1-p),1,1,0,0,0);
  }
  for(let i=0;i<sdsc.blue.length;i++){
    const el=sdsc.blue[i];
    const p=u<0.5?smooth(phase(u,0.14+i*0.012,0.30+i*0.012)):1-smooth(phase(u,0.70+i*0.008,0.90+i*0.008));
    setOp(el,p);
    setTransform(el,0,10*(1-p),1,1,0,0,0);
  }
  const scanP=u<0.5?easeOut(phase(u,0.08,0.36)):1-easeOut(phase(u,0.70,0.90));
  const sx=(1611.98*scanP).toFixed(2);
  sdsc.scan.setAttribute("x1",sx);
  sdsc.scan.setAttribute("x2",sx);
  const scanOp=smooth(phase(u,0.08,0.12))*(1-smooth(phase(u,0.36,0.42)));
  setOp(sdsc.scan,scanOp*0.8);
  const ruleP=u<0.5?easeOut(phase(u,0.10,0.34)):1-easeOut(phase(u,0.72,0.90));
  sdsc.rule.setAttribute("x2",(1611.98*ruleP).toFixed(2));
  setOp(sdsc.rule,smooth(phase(u,0.10,0.14))*(1-smooth(phase(u,0.34,0.40)))*0.9);
  const guideOp=Math.max(smooth(phase(u,0.02,0.08))*(1-smooth(phase(u,0.30,0.38))),smooth(phase(u,0.64,0.70))*(1-smooth(phase(u,0.88,0.94))));
  setOp(sdsc.guidesGroup,guideOp);
  const gd=u<0.5?phase(u,0.03,0.22):1-phase(u,0.72,0.90);
  for(const g of sdsc.guides)g.el.setAttribute("x2",(g.x+g.len*gd).toFixed(2));
  if(u>=0.46&&u<0.62){
    setOp(sdsc.place,1);
    for(const el of sdsc.gold){setOp(el,1);el.removeAttribute("transform");}
    for(const el of sdsc.blue){setOp(el,1);el.removeAttribute("transform");}
    setOp(sdsc.scan,0);setOp(sdsc.rule,0);setOp(sdsc.guidesGroup,0);
  }
}

const ACT_DUR=9;
const TOTAL=9;
const ACTS=[
  {id:"esnet",start:0,group:document.getElementById("act-esnet"),render:renderESnet}
];
function renderAll(t){
  setOp(variation.overlay,0);
  for(const a of ACTS){
    const u=(t-a.start)/ACT_DUR;
    const active=u>=0&&u<1;
    a.group.style.display=active?"":"none";

    if(active){
      a.render(clamp(u));
      if(a.id!=="esnet")applyActVariation(a.group,a.id,clamp(u),variationByAct[a.id]);
    }
  }
  if(t>=TOTAL)for(const a of ACTS)a.group.style.display="none";
}
setupESnet();
setupVariations();
const ui={
  play:document.getElementById("play"),
  playall:document.getElementById("playall"),
  loop:document.getElementById("loop"),
  fullscreen:document.getElementById("fullscreen"),
  clean:document.getElementById("clean"),
  time:document.getElementById("time"),
  progress:document.getElementById("progress"),
  track:document.getElementById("track"),
  chapters:[...document.querySelectorAll(".chapter")]
};
let time=0;
let playing=!matchMedia("(prefers-reduced-motion: reduce)").matches;
let loop=true;
let chapterMode=false;
let chapterEnd=null;
let last=performance.now();
function fmt(t){const s=Math.floor(t%60),m=Math.floor(t/60);return `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`}
function updateUI(t){
  ui.progress.style.width=`${clamp(t/TOTAL)*100}%`;
  ui.time.textContent=`${fmt(t)} / ${fmt(TOTAL)}`;
  ui.play.textContent=playing?"PAUSE":"PLAY";
  ui.play.setAttribute("aria-label",playing?"Pause":"Play");
  const idx=Math.min(Math.floor(t/ACT_DUR),ACTS.length-1);
  ui.chapters.forEach((b,i)=>b.classList.toggle("active",i===idx&&t<TOTAL));
  updateVariationUI(idx);
}
function setTime(t){time=clamp(t,0,TOTAL);renderAll(time);updateUI(time)}
function play(){if(time>=TOTAL)time=0;playing=true;last=performance.now();updateUI(time)}
function pause(){playing=false;updateUI(time)}
function toggle(){playing?pause():play()}
function playAll(){chapterMode=false;chapterEnd=null;setTime(0);play()}
function seekAct(i){if(i<0||i>=ACTS.length)return;chapterMode=true;chapterEnd=ACTS[i].start+ACT_DUR;setTime(ACTS[i].start);play()}
function toggleLoop(){loop=!loop;ui.loop.textContent=loop?"LOOP ON":"LOOP OFF";ui.loop.setAttribute("aria-pressed",String(loop))}
function toggleClean(){document.body.classList.toggle("clean")}
function toggleFullscreen(){const f=document.getElementById("stage-frame");if(document.fullscreenElement)document.exitFullscreen();else f.requestFullscreen()}
ui.play.addEventListener("click",toggle);
ui.playall.addEventListener("click",playAll);
ui.loop.addEventListener("click",toggleLoop);
ui.fullscreen.addEventListener("click",toggleFullscreen);
ui.clean.addEventListener("click",toggleClean);
const variationSelect=document.getElementById("variation-select");
function activeActIndex(t){return Math.min(Math.max(Math.floor(t/ACT_DUR),0),ACTS.length-1)}
function getVariationForAct(i){const id=ACTS[i].id;return id==="esnet"?esnetStyle:variationByAct[id]}
function setVariationForAct(i,v){const id=ACTS[i].id;if(id==="esnet")esnetStyle=v;else variationByAct[id]=v}
function updateVariationUI(i){
  i=Math.min(Math.max(i,0),ACTS.length-1);
  if(i!==variationActIndex){
    variationActIndex=i;
    const names=VARIATION_NAMES[ACTS[i].id];
    variationSelect.innerHTML=names.map((n,k)=>`<option value="${k}">${n}</option>`).join("");
  }
  variationSelect.value=String(getVariationForAct(i));
}
function previewVariation(v){
  const i=variationActIndex>=0?variationActIndex:0;
  setVariationForAct(i,v);
  chapterMode=true;
  chapterEnd=ACTS[i].start+ACT_DUR;
  setTime(ACTS[i].start);
  play();
}
variationSelect.addEventListener("change",()=>previewVariation(parseInt(variationSelect.value,10)));
ui.chapters.forEach((b,i)=>b.addEventListener("click",()=>seekAct(i)));
ui.track.addEventListener("click",e=>{const r=ui.track.getBoundingClientRect();setTime(clamp((e.clientX-r.left)/r.width)*TOTAL)});
document.getElementById("stage-frame").addEventListener("click",e=>{if(e.target.closest("#ui"))return;toggle()});
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA")return;
  if(e.code==="Space"){e.preventDefault();toggle()}
  else if(e.key==="1")seekAct(0);
  else if(e.key==="2")seekAct(1);
  else if(e.key==="3")seekAct(2);
  else if(e.key==="4")seekAct(3);
  else if(e.key==="5")seekAct(4);
  else if(e.key==="6")seekAct(5);
  else if(e.key==="7")seekAct(6);
  else if(e.key==="8")seekAct(7);
  else if(e.key==="r"||e.key==="R")playAll();
  else if(e.key==="l"||e.key==="L")toggleLoop();
  else if(e.key==="f"||e.key==="F")toggleFullscreen();
  else if(e.key==="h"||e.key==="H")toggleClean();
  else if(e.key==="ArrowLeft"){e.preventDefault();setTime(time-1)}
  else if(e.key==="ArrowRight"){e.preventDefault();setTime(time+1)}
  else if(e.key==="Escape"&&document.body.classList.contains("clean"))toggleClean();
});
function readHash(){
  const p=new URLSearchParams(location.hash.slice(1));
  if(p.has("clean"))document.body.classList.add("clean");
  if(p.has("s")){const i=parseInt(p.get("s"),10);if(i>=0&&i<10)esnetStyle=i;}
  if(p.has("t")){
    const t=parseFloat(p.get("t"));
    if(Number.isFinite(t)){playing=false;setTime(t)}
  }
  if(p.has("act")){
    const i=parseInt(p.get("act"),10);
    if(i>=0&&i<ACTS.length){playing=false;setTime(ACTS[i].start)}
  }
  if(p.has("var")){
    const vi=parseInt(p.get("var"),10);
    const ai=p.has("act")?parseInt(p.get("act"),10):activeActIndex(time);
    if(ai>=0&&ai<ACTS.length){
      const names=VARIATION_NAMES[ACTS[ai].id];
      if(vi>=0&&vi<names.length){
        setVariationForAct(ai,vi);
        playing=false;
        setTime(ACTS[ai].start);
      }
    }
  }
}
function tick(now){
  if(window.__stopped)return;
  const dt=Math.min(0.05,(now-last)/1000);
  last=now;
  if(playing){
    time+=dt;
    if(chapterMode&&chapterEnd!==null&&time>=chapterEnd){
      time=chapterEnd;
      playing=false;
      chapterMode=false;
      chapterEnd=null;
    }else if(time>=TOTAL){
      if(loop&&!chapterMode)time=time%TOTAL;
      else{time=TOTAL;playing=false}
    }
  }
  renderAll(time);
  updateUI(time);
  requestAnimationFrame(tick);
}
renderAll(0);
updateUI(0);
readHash();
if(matchMedia("(prefers-reduced-motion: reduce)").matches&&!location.hash){playing=false;setTime(4.3)}
window.__seek=setTime;
window.__play=play;
window.__pause=pause;
window.__state=()=>({time,playing,loop,chapterMode,esnetStyle,variation:getVariationForAct(activeActIndex(time)),variations:{...variationByAct,esnet:esnetStyle}});
window.__stop=()=>{window.__stopped=true};
window.__esnetRibbonState=()=>({gray:esnet.lastGray,net:esnet.lastNet,blue:esnet.lastBlue,light:esnet.lastLight,word:esnet.lastWord});
window.__esnetHoldOpacity=()=>esnet.lastWord;
window.__inmonState=()=>({redFill:parseFloat(inmon.redArc.getAttribute("fill-opacity")||"0"),wordWidth:parseFloat(inmon.wordClipRect.getAttribute("width")||"0")/3378,dot:parseFloat(inmon.redDot.getAttribute("opacity")||"0"),official:parseFloat(inmon.official.getAttribute("opacity")||"1")});
window.__nrpState=()=>({blue:parseFloat(nrp.blue?.[0]?.getAttribute("fill-opacity")||"0"),gray:parseFloat(nrp.grayWord?.getAttribute("opacity")||"0"),clip:parseFloat(nrp.grayClipRect?.getAttribute("width")||"0")/2192,ghost:parseFloat(nrp.blueGhosts?.[0]?.el.getAttribute("opacity")||"0"),scan:parseFloat(nrp.scanLine?.getAttribute("opacity")||"0")});
requestAnimationFrame(tick);
</script>
