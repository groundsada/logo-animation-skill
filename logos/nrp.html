<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NRP — Logo Animation</title>
<style>
:root{
  --bg:#080B10;--panel:#0E141B;--line:#1D2632;--text:#E9EEF4;--muted:#7D8A99;
  --accent:#FF3694;--blue:#3890D6;--orange:#F48C2F;--green:#7AA154;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;overflow:hidden;color:var(--text);
  background:radial-gradient(125% 95% at 50% 0%,#111821 0%,#080B10 55%,#05070A 100%);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
}
#shell{height:100%;display:flex;flex-direction:column;min-height:0}
#stage-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:26px 28px 18px;min-height:0}
#stage-frame{
  position:relative;width:min(100%,calc((100vh - 190px)*16/9));aspect-ratio:16/9;
  background:#fff;border-radius:4px;overflow:hidden;cursor:pointer;
  box-shadow:0 34px 90px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.06);
}
#stage{display:block;width:100%;height:100%;background:transparent;position:relative;z-index:1}
#ui{flex:0 0 auto;padding:0 30px 24px;width:100%;max-width:1600px;margin:0 auto}
#topline{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:12px}
#chapters{display:flex;gap:6px;flex-wrap:wrap}
.chapter{
  appearance:none;border:1px solid transparent;background:transparent;color:var(--muted);
  font:600 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;
  padding:10px 12px;border-radius:3px;cursor:pointer;transition:color .2s,border-color .2s,background .2s;
}
.chapter:hover{color:var(--text);border-color:var(--line)}
.chapter.active{color:#fff;border-color:var(--line);background:#121923}
.chapter .dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:8px;vertical-align:1px;background:currentColor;opacity:.5}
.chapter[data-act="0"].active .dot{background:var(--accent);opacity:1}
.chapter[data-act="1"].active .dot{background:var(--orange);opacity:1}
.chapter[data-act="2"].active .dot{background:var(--blue);opacity:1}
.chapter[data-act="3"].active .dot{background:#BF2027;opacity:1}
.chapter[data-act="4"].active .dot{background:#3FBECF;opacity:1}
.chapter[data-act="5"].active .dot{background:#F37421;opacity:1}
.chapter[data-act="6"].active .dot{background:#DB3123;opacity:1}
.chapter[data-act="7"].active .dot{background:#C69214;opacity:1}
#time{font:500 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);letter-spacing:.08em;white-space:nowrap}
#track{height:2px;background:#1A222D;border-radius:2px;cursor:pointer;position:relative;margin-bottom:18px}
#progress{position:absolute;left:0;top:0;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--orange) 50%,var(--blue));border-radius:2px}
#track .tick{position:absolute;top:-3px;width:1px;height:8px;background:#2A3543}
#controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{
  appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--text);
  font:600 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em;
  padding:10px 14px;border-radius:3px;cursor:pointer;transition:background .2s,border-color .2s,color .2s;
}
.btn:hover{background:#151D27;border-color:#2A3543}
.btn.primary{background:#E9EEF4;color:#080B10;border-color:#E9EEF4}
.btn.primary:hover{background:#fff}
.btn[aria-pressed="true"]{border-color:var(--blue);color:#fff}
#styles{display:flex;align-items:center;gap:8px;border-left:1px solid var(--line);padding-left:12px;margin-left:4px}
#styles-label{font:600 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:#5E6B7A;letter-spacing:.12em;margin-right:2px}
#variation-select{
  appearance:none;border:1px solid var(--line);background-color:var(--panel);color:var(--text);
  font:600 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em;
  padding:9px 30px 9px 10px;border-radius:3px;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,#7D8A99 50%),linear-gradient(135deg,#7D8A99 50%,transparent 50%);
  background-position:calc(100% - 13px) 50%,calc(100% - 9px) 50%;
  background-size:4px 4px,4px 4px;background-repeat:no-repeat;
}
#variation-select:hover{border-color:#2A3543}
#hint{margin-left:auto;color:#5E6B7A;font:500 10px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.04em;text-align:right}
#hint b{color:#8B99A8;font-weight:600}
body.clean #ui{display:none}
body.clean #stage-wrap{padding:0}
body.clean #stage-frame{width:min(100vw,calc(100vh*16/9));max-height:100vh;border-radius:0;box-shadow:none}
#stage-frame:fullscreen{width:100vw;height:100vh;max-width:none;max-height:none;aspect-ratio:auto;border-radius:0;box-shadow:none;background:#fff;cursor:default}
#stage-frame:fullscreen #stage{width:100%;height:100%}
@media (max-width:720px){
  #stage-wrap{padding:12px 12px 8px}
  #ui{padding:0 14px 14px}
  #hint{display:none}
  .chapter{padding:9px 8px;letter-spacing:.08em}
  .btn{padding:9px 10px}
}
</style>
</head>

<script>
const NS="http://www.w3.org/2000/svg";
const stage=document.getElementById("stage");
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=t=>{t=clamp(t);return t*t*(3-2*t)};
const easeOut=t=>1-Math.pow(1-clamp(t),3);
const easeInOut=t=>{t=clamp(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
const easeOutBack=t=>{t=clamp(t);const c=1.45;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)};
const phase=(u,a,b)=>clamp((u-a)/(b-a));
const ellipseLen=(rx,ry)=>Math.PI*(3*(rx+ry)-Math.sqrt((3*rx+ry)*(rx+3*ry)));
const el=(tag,attrs={},parent)=>{const e=document.createElementNS(NS,tag);for(const[k,v]of Object.entries(attrs))e.setAttribute(k,v);if(parent)parent.appendChild(e);return e};
const setOp=(e,v)=>e.setAttribute("opacity",clamp(v).toFixed(4));
const setFillOp=(e,v)=>e.setAttribute("fill-opacity",clamp(v).toFixed(4));
const setDash=(e,L,p)=>{e.style.strokeDasharray=String(L);e.style.strokeDashoffset=String(L*(1-clamp(p)))};
const setTransform=(e,x=0,y=0,sx=1,sy=1,rot=0,cx=0,cy=0)=>{
  e.setAttribute("transform",`translate(${x.toFixed(3)} ${y.toFixed(3)}) translate(${cx.toFixed(3)} ${cy.toFixed(3)}) rotate(${rot.toFixed(3)}) scale(${sx.toFixed(4)} ${sy.toFixed(4)}) translate(${(-cx).toFixed(3)} ${(-cy).toFixed(3)})`);
};

function setupScinet(){
  const svg=document.getElementById("scinet-svg");
  scinet.netGroup=document.getElementById("scinet-net-paths");
  scinet.netPaths=[...document.querySelectorAll("#scinet-net-paths .net-path")];
  scinet.nodeGroup=document.getElementById("scinet-nodes");
  scinet.pulseGroup=document.getElementById("scinet-pulses");
  scinet.ring1=document.getElementById("scinet-ring-1");
  scinet.ring2=document.getElementById("scinet-ring-2");
  scinet.black=svg.querySelector("path:not([class])");
  scinet.blue=[...svg.querySelectorAll(".cls-1")];
  scinet.star=svg.querySelector("polygon.cls-2");
  scinet.ghosts=[];
  const parts=[scinet.black,...scinet.blue,scinet.star];
  for(const source of parts){
    let ghost;
    if(source.tagName.toLowerCase()==="rect"){
      const x=source.getAttribute("x"),y=source.getAttribute("y"),w=source.getAttribute("width"),h=source.getAttribute("height");
      ghost=el("path",{d:`M${x},${y}h${w}v${h}h-${w}z`});
    }else{
      ghost=source.cloneNode(false);
      ghost.removeAttribute("class");
    }
    const color=getComputedStyle(source).fill;
    ghost.setAttribute("fill","none");
    ghost.setAttribute("stroke",color);
    ghost.setAttribute("stroke-width","0.32");
    ghost.setAttribute("stroke-linecap","round");
    ghost.setAttribute("stroke-linejoin","round");
    ghost.setAttribute("opacity","0");
    source.parentNode.insertBefore(ghost,source.nextSibling);
    const L=ghost.getTotalLength?ghost.getTotalLength():100;
    scinet.ghosts.push({el:ghost,L,source,isStar:source===scinet.star,isBlue:scinet.blue.includes(source)});
  }
  for(const e of [scinet.black,...scinet.blue,scinet.star])setFillOp(e,0);
  scinet.net=scinet.netPaths.map((p,i)=>({el:p,L:p.getTotalLength(),offset:(i*0.137)%1,speed:0.8+(i%3)*0.12}));
  scinet.nodes=[[949,453,0.00],[760,630,0.05],[820,670,0.10],[1080,470,0.08],[1240,620,0.12],[1120,660,0.15],[700,520,0.18]].map(([x,y,delay])=>{
    const c=el("circle",{cx:x,cy:y,r:4,fill:"#ffffff",stroke:"#3890d6","stroke-width":2.2,opacity:0},scinet.nodeGroup);
    return {el:c,x,y,delay};
  });
  scinet.pulses=[];
  scinet.net.forEach((n,i)=>{
    for(let k=0;k<2;k++){
      const c=el("circle",{r:k===0?3.2:2.4,fill:k===0?"#ff3694":"#3890d6",opacity:0},scinet.pulseGroup);
      scinet.pulses.push({el:c,path:n.el,L:n.L,offset:(i*0.19+k*0.53)%1,speed:0.9+(i%4)*0.1});
    }
  });
}
function renderScinet(u){
  const netOp=Math.max(smooth(phase(u,0.06,0.30))*(1-smooth(phase(u,0.34,0.40))),smooth(phase(u,0.62,0.72))*(1-smooth(phase(u,0.88,0.94))));
  setOp(scinet.netGroup,netOp*0.85);
  const drawP=u<0.5?phase(u,0.06,0.28):1-phase(u,0.78,0.92);
  for(const n of scinet.net)setDash(n.el,n.L,drawP);
  const pulseA=smooth(phase(u,0.06,0.12))*(1-smooth(phase(u,0.34,0.40)))+smooth(phase(u,0.64,0.70))*(1-smooth(phase(u,0.88,0.94)));
  for(const p of scinet.pulses){
    const t=(u*p.speed+p.offset)%1;
    const pt=p.path.getPointAtLength(t*p.L);
    p.el.setAttribute("cx",pt.x.toFixed(2));
    p.el.setAttribute("cy",pt.y.toFixed(2));
    setOp(p.el,pulseA*(0.25+0.75*Math.sin(t*Math.PI)));
  }
  for(const n of scinet.nodes){
    const p=phase(u,0.10+n.delay,0.22+n.delay);
    n.el.setAttribute("r",(4*easeOutBack(p)).toFixed(2));
    setOp(n.el,p*(1-smooth(phase(u,0.34,0.40)))+smooth(phase(u,0.64,0.70))*(1-smooth(phase(u,0.86,0.92))));
  }
  const convP=easeOut(phase(u,0.08,0.30));
  const convRev=smooth(phase(u,0.62,0.72))*(1-smooth(phase(u,0.82,0.90)));
  const convOp=Math.max(smooth(phase(u,0.08,0.14))*(1-smooth(phase(u,0.26,0.34)))*0.42,convRev*0.40);
  scinet.ring1.setAttribute("r",(320-250*convP+180*convRev).toFixed(1));
  scinet.ring2.setAttribute("r",(280-210*convP+150*convRev).toFixed(1));
  setOp(scinet.ring1,convOp);
  setOp(scinet.ring2,convOp*0.8);
  const ghostP=u<0.5?phase(u,0.26,0.40):1-phase(u,0.70,0.88);
  const ghostOp=smooth(phase(u,0.24,0.30))*(1-smooth(phase(u,0.38,0.42)))+smooth(phase(u,0.58,0.62))*(1-smooth(phase(u,0.84,0.90)));
  const starGhostOp=smooth(phase(u,0.10,0.16))*(1-smooth(phase(u,0.22,0.30)))+smooth(phase(u,0.60,0.66))*(1-smooth(phase(u,0.80,0.88)));
  for(const g of scinet.ghosts){
    setDash(g.el,g.L,ghostP);
    setOp(g.el,g.isStar?starGhostOp:ghostOp);
  }
  const fillOp=Math.min(smooth(phase(u,0.36,0.42)),1-smooth(phase(u,0.58,0.64)));
  for(const e of [scinet.black,...scinet.blue])setFillOp(e,fillOp);
  const starOp=smooth(phase(u,0.10,0.18))*(1-smooth(phase(u,0.62,0.72)));
  setFillOp(scinet.star,starOp);
  const starIn=smooth(phase(u,0.12,0.26));
  const starOut=smooth(phase(u,0.60,0.78));
  const starS=(0.2+0.8*easeOutBack(starIn))*(1+0.6*starOut);
  const starRot=lerp(-35,0,easeOut(starIn))+starOut*60;
  const starY=-6*starOut;
  const starT={x:0,y:starY,sx:starS,sy:starS,rot:starRot,cx:59.5,cy:6.3};
  setTransform(scinet.star,starT.x,starT.y,starT.sx,starT.sy,starT.rot,starT.cx,starT.cy);
  const split=smooth(phase(u,0.64,0.86));
  const scShift=-3.5*split;
  const inetShift=3.5*split;
  for(const g of scinet.ghosts){
    if(g.isStar){
      setTransform(g.el,starT.x,starT.y,starT.sx,starT.sy,starT.rot,starT.cx,starT.cy);
    }else if(g.isBlue){
      setTransform(g.el,inetShift,-0.5*split);
    }else{
      setTransform(g.el,scShift,0);
    }
  }
  setTransform(scinet.black,scShift,0);
  for(const e of scinet.blue)setTransform(e,inetShift,-0.5*split);
  const assemble=smooth(phase(u,0.30,0.40));
  const reverse=smooth(phase(u,0.60,0.72));
  const logoY=lerp(12,0,easeOut(assemble))-26*reverse;
  const logoScale=lerp(1.045,1,easeOut(assemble))*(1+0.02*reverse);
  document.getElementById("scinet-logo").setAttribute("transform",`translate(480 ${(403.7+logoY).toFixed(2)})`);
  document.getElementById("scinet-scale").setAttribute("transform",`scale(${(7.8785*logoScale).toFixed(4)})`);
  setOp(document.getElementById("scinet-logo"),1-smooth(phase(u,0.80,0.92)));
}

  for(const x of xs)sc26.grid.push({el:el("line",{x1:x,y1:790,x2:x,y2:790,stroke:"#E1E7EE","stroke-width":1,opacity:0},sc26.gridGroup),x,len:470});
  for(const y of [760,715])sc26.grid.push({el:el("line",{x1:470,y1:y,x2:470,y2:y,stroke:"#DCE3EA","stroke-width":1,opacity:0},sc26.gridGroup),y,len:500});
  sc26.flowGroup=document.getElementById("sc26-flow");

function renderSC26(u){
  const gridOp=smooth(phase(u,0.06,0.14))*(1-smooth(phase(u,0.30,0.38)))+smooth(phase(u,0.60,0.68))*(1-smooth(phase(u,0.86,0.92)));
  setOp(sc26.gridGroup,gridOp*0.9);
  const gridDraw=u<0.5?phase(u,0.06,0.28):1-phase(u,0.80,0.92);
  for(const g of sc26.grid){
    if(g.x!==undefined)g.el.setAttribute("y2",(790-g.len*gridDraw).toFixed(2));
    else g.el.setAttribute("x2",(470+g.len*gridDraw).toFixed(2));
  }
  const rise=[[sc26.orange,0.10,0.26],[sc26.green[0],0.13,0.29],[sc26.green[1],0.16,0.32],[sc26.river,0.12,0.30]];
  for(const[e,a,b]of rise){
    const p=easeOutBack(phase(u,a,b));
    const q=smooth(phase(u,0.64,0.82));
    const bb=e._bbox;
    const yOff=(1-p)*14+q*10;
    const sy=lerp(0.2,1,p)*(1-0.15*q);
    const sx=1+0.05*q;
    setTransform(e,0,yOff,sx,sy,0,bb.x+bb.width/2,bb.y+bb.height);
    setOp(e,smooth(phase(u,a-0.03,b)));
  }
  const stars=[sc26.magentaStar,...sc26.blueStars];
  stars.forEach((e,i)=>{
    const p=easeOutBack(phase(u,0.12+i*0.02,0.26+i*0.02));
    const q=smooth(phase(u,0.62+i*0.01,0.78+i*0.01));
    const bb=e._bbox;
    const cx=bb.x+bb.width/2,cy=bb.y+bb.height/2;
    const s=lerp(0.1,1,p)*(1+0.6*q);
    const rot=(i%2?-1:1)*25*q;
    setTransform(e,0,-2*q,s,s,rot,cx,cy);
    setOp(e,smooth(phase(u,0.10+i*0.02,0.18+i*0.02)));
  });
  sc26.word.forEach((e,i)=>{
    const p=easeOutBack(phase(u,0.24+i*0.03,0.34+i*0.03));
    const q=smooth(phase(u,0.60,0.74));
    const bb=e._bbox;
    setTransform(e,0,(1-p)*8-q*6,1+q*0.04,lerp(0.4,1,p),0,bb.x+bb.width/2,bb.y+bb.height);
    setOp(e,smooth(phase(u,0.22+i*0.03,0.30+i*0.03)));
  });
  sc26.hpc.forEach((e,i)=>{
    const p=easeOut(phase(u,0.25+i*0.0032,0.33+i*0.0032));
    const q=smooth(phase(u,0.60,0.76));
    const bb=e._bbox;
    const dx=q*(i%2?2:-2);
    const dy=(1-p)*4-q*3;
    setTransform(e,dx,dy,1+q*0.06,lerp(0.5,1,p),0,bb.x+bb.width/2,bb.y+bb.height);
    setOp(e,smooth(phase(u,0.23+i*0.0032,0.31+i*0.0032)));
  });
  const flowOp=smooth(phase(u,0.64,0.72))*(1-smooth(phase(u,0.86,0.94)));
  setOp(sc26.flowGroup,flowOp);
  sc26.flow.forEach((f,i)=>{
    const p=smooth(phase(u,0.66+i*0.01,0.78+i*0.01));
    f.el.setAttribute("x2",(f.x+f.len*p).toFixed(2));
    f.el.setAttribute("opacity",(0.7*flowOp).toFixed(3));
  });
  const parOp=smooth(phase(u,0.64,0.72))*(1-smooth(phase(u,0.86,0.94)));
  setOp(sc26.parallelGroup,parOp*0.8);
  sc26.parallel.forEach((b,i)=>{
    const p=smooth(phase(u,0.66+i*0.008,0.78+i*0.008));
    b.el.setAttribute("x2",(b.x+b.len*p).toFixed(2));
    b.el.setAttribute("opacity",(0.85*parOp).toFixed(3));
  });
  setOp(sc26.linksGroup,parOp);
  sc26.links.forEach((l,i)=>{
    const p=smooth(phase(u,0.66+i*0.01,0.80+i*0.01));
    l.el.style.strokeDashoffset=String(l.L*(1-p));
    l.el.setAttribute("opacity",(0.7*parOp).toFixed(3));
  });
  const assemble=smooth(phase(u,0.30,0.40));
  const reverse=smooth(phase(u,0.60,0.72));
  const logoY=lerp(10,0,easeOut(assemble))-20*reverse;
  const logoScale=lerp(1.04,1,easeOut(assemble))*(1+0.02*reverse);
  document.getElementById("sc26-logo").setAttribute("transform",`translate(500 ${(350.5+logoY).toFixed(2)})`);
  document.getElementById("sc26-scale").setAttribute("transform",`scale(${(5.2458*logoScale).toFixed(4)})`);
  setOp(document.getElementById("sc26-logo"),1-smooth(phase(u,0.82,0.94)));
}
function setupESnet(){
  esnet.center={x:551.6,y:540};
  esnet.grayWrap=document.getElementById("esnet-gray-wrap");
  esnet.gray=document.getElementById("esnet-gray");
  esnet.blue=document.getElementById("esnet-blue");
  esnet.light=document.getElementById("esnet-light");

  esnet.blueGhost=document.getElementById("esnet-blue-ghost");
  esnet.lightGhost=document.getElementById("esnet-light-ghost");
  esnet.wordRect=document.getElementById("esnet-word-rect");

  esnet.gridGroup=document.getElementById("esnet-grid");
  esnet.grid=[];
  for(let i=0;i<9;i++){const x=430+i*32;esnet.grid.push({el:el("line",{x1:x,y1:380,x2:x,y2:700,stroke:"#DCE3EA","stroke-width":0.8},esnet.gridGroup),kind:"v",L:320})}
  for(let j=0;j<11;j++){const y=390+j*30;esnet.grid.push({el:el("line",{x1:390,y1:y,x2:710,y2:y,stroke:"#DCE3EA","stroke-width":0.8},esnet.gridGroup),kind:"h",L:320})}
  esnet.orbitsGroup=document.getElementById("esnet-orbits");
  esnet.orbitsGroup.setAttribute("transform","translate(551.6 540)");
  esnet.orbits=[];
  for(const d of [{rx:220,ry:100,ang:-25},{rx:260,ry:120,ang:30},{rx:300,ry:80,ang:70}]){
    const e=el("ellipse",{cx:0,cy:0,rx:d.rx,ry:d.ry,fill:"none",stroke:"#3890d6","stroke-width":1.2,transform:`rotate(${d.ang})`},esnet.orbitsGroup);
    const L=Math.PI*(3*(d.rx+d.ry)-Math.sqrt((3*d.rx+d.ry)*(d.rx+3*d.ry)));
    e.style.strokeDasharray=String(L);e.style.strokeDashoffset=String(L);
    esnet.orbits.push({el:e,...d,L});
  }
  esnet.lastGray=0;esnet.lastNet=0;esnet.lastBlue=0;esnet.lastLight=0;esnet.lastWord=0;
  esnet.sparklesGroup=document.getElementById("esnet-sparkles");
  esnet.sparkles=[];
  const starD="M0 -12 C2 -3 3 -2 12 0 C3 2 2 3 0 12 C-2 3 -3 2 -12 0 C-3 -2 -2 -3 0 -12 Z";
  const positions=[[356,360],[704,382],[760,566],[666,704],[470,724],[330,562]];
  for(let i=0;i<positions.length;i++){
    const [x,y]=positions[i];
    const g=el("g",{},esnet.sparklesGroup);
    el("path",{d:starD,fill:i%2?"#5EB2D7":"#ffffff",opacity:1},g);
    g.setAttribute("transform",`translate(${x} ${y})`);
    setOp(g,0);
    esnet.sparkles.push({el:g,x,y,phase:i/positions.length});
  }
  esnet.weave=[];
  const weavePos=[[598.2,485.9],[470.9,555.7],[655.7,606.8]];
  for(let i=0;i<weavePos.length;i++){
    const [x,y]=weavePos[i];
    const g=el("g",{},esnet.sparklesGroup);
    el("path",{d:starD,fill:i===1?"#ffffff":"#5EB2D7",opacity:1},g);
    g.setAttribute("transform",`translate(${x} ${y})`);
    setOp(g,0);
    esnet.weave.push({el:g,x,y});
  }
  esnet.pulses=[];
  for(let i=0;i<4;i++){
    const c=el("circle",{r:3.2,fill:i%2?"#ffffff":"#5EB2D7",stroke:i%2?"#5EB2D7":"#ffffff","stroke-width":1.5,opacity:0},esnet.sparklesGroup);
    esnet.pulses.push({el:c,theta:i*Math.PI/2,radius:190+(i%2)*22,speed:0.55+(i%3)*0.12});
  }
  esnet.motion=document.getElementById("esnet-motion");
  esnet.official=document.getElementById("esnet-official");
  esnet.platesGroup=document.getElementById("esnet-plates");
  esnet.slicesGroup=document.getElementById("esnet-slices");
  esnet.sliceGuide=document.getElementById("esnet-slice-guide");
  esnet.plateInners=[...document.querySelectorAll(".esnet-plate-inner")];
  esnet.sliceInners=[...document.querySelectorAll(".esnet-slice-inner")];
  esnet.constGroup=document.getElementById("esnet-constellation");
  esnet.irisGroup=document.getElementById("esnet-iris-guide");
  esnet.irisCircle=document.getElementById("esnet-iris-circle");
  esnet.spinGroup=document.getElementById("esnet-spin-guide");
  esnet.registerGroup=document.getElementById("esnet-register");
  esnet.constNodes=[];esnet.constLinks=[];
  const addConstellation=(path,count,size,color,phaseOffset,chordStep)=>{
    const L=path.getTotalLength();
    const pts=[];
    for(let i=0;i<count;i++){
      const p=path.getPointAtLength(L*((i+0.5)/count));
      pts.push({x:400+p.x*0.75727,y:388.2+p.y*0.75727});
    }
    const addLink=(a,b,width,opacity,delay)=>{
      const len=Math.hypot(b.x-a.x,b.y-a.y);
      const line=el("line",{x1:a.x,y1:a.y,x2:b.x,y2:b.y,stroke:color,"stroke-width":width,"stroke-linecap":"round"},esnet.constGroup);
      line.style.strokeDasharray=String(len);
      line.style.strokeDashoffset=String(len);
      esnet.constLinks.push({el:line,L:len,delay,opacity});
    };
    for(let i=0;i<pts.length-1;i++){
      addLink(pts[i],pts[i+1],2.2,0.92,i/Math.max(1,pts.length-1)*0.06);
    }
    for(let i=0;i<pts.length-chordStep;i+=2){
      addLink(pts[i],pts[i+chordStep],1.3,0.38,0.04+i/Math.max(1,pts.length-1)*0.04);
    }
    for(let i=0;i<pts.length;i++){
      const angle=i*2.399963+phaseOffset;
      const rad=300+((i*97)%240);
      const start={x:960+Math.cos(angle)*rad*1.15,y:540+Math.sin(angle)*rad*0.7};
      const halo=el("circle",{cx:start.x,cy:start.y,r:size*2.8,fill:color,stroke:"none"},esnet.constGroup);
      const c=el("circle",{cx:start.x,cy:start.y,r:size,fill:"#ffffff",stroke:color,"stroke-width":1.4},esnet.constGroup);
      esnet.constNodes.push({el:c,halo,start,target:pts[i],delay:i/Math.max(1,pts.length-1)*0.06});
    }
  };
  addConstellation(esnet.blue,44,3.4,"#3890d6",0.2,5);
  addConstellation(esnet.light,20,2.8,"#62CAF5",1.1,4);
  const regColor="#FF3694";
  for(const [x,y] of [[376,364],[1544,364],[376,716],[1544,716],[960,540]]){
    const d=`M${x-14} ${y}H${x-5}M${x+5} ${y}H${x+14}M${x} ${y-14}V${y-5}M${x} ${y+5}V${y+14}`;
    el("path",{d,fill:"none",stroke:regColor,"stroke-width":1.3,"stroke-linecap":"round"},esnet.registerGroup);
  }
  el("rect",{x:376,y:364,width:1168,height:352,fill:"none",stroke:regColor,"stroke-width":0.8,"stroke-dasharray":"4 8",opacity:0.7},esnet.registerGroup);
  esnet.irisRings=[];
  for(const [r,color,width] of [[210,"#3890d6",1.1],[280,"#5EB2D7",0.9],[360,"#62CAF5",0.7]]){
    const c=el("circle",{cx:960,cy:540,r:0,fill:"none",stroke:color,"stroke-width":width,"stroke-dasharray":"3 10",opacity:0.8},esnet.irisGroup);
    esnet.irisRings.push({el:c,r});
  }
  esnet.irisTicks=el("g",{},esnet.irisGroup);
  for(let i=0;i<24;i++){
    const a=i*Math.PI/12;
    el("line",{x1:960+Math.cos(a)*392,y1:540+Math.sin(a)*392,x2:960+Math.cos(a)*416,y2:540+Math.sin(a)*416,stroke:"#3890d6","stroke-width":1,opacity:0.6},esnet.irisTicks);
  }
  for(const [r,color,width] of [[250,"#3890d6",0.9],[320,"#5EB2D7",0.8],[390,"#62CAF5",0.7]]){
    el("circle",{cx:960,cy:540,r,fill:"none",stroke:color,"stroke-width":width,"stroke-dasharray":"2 12",opacity:0.7},esnet.spinGroup);
  }
  esnet.spinSpokes=el("g",{},esnet.spinGroup);
  for(let i=0;i<12;i++){
    const a=i*Math.PI/6;
    el("line",{x1:960+Math.cos(a)*300,y1:540+Math.sin(a)*300,x2:960+Math.cos(a)*370,y2:540+Math.sin(a)*370,stroke:"#5EB2D7","stroke-width":1,opacity:0.5},esnet.spinSpokes);
  }
  for(let i=1;i<16;i++){
    const y=388.2+(303.6/16)*i;
    el("line",{x1:400,y1:y,x2:1520,y2:y,stroke:"#62CAF5","stroke-width":0.8,opacity:0.55},esnet.sliceGuide);
  }
}
function resetEsnetDecor(){
  esnet.motion.removeAttribute("transform");
  esnet.motion.removeAttribute("clip-path");
  esnet.irisCircle.setAttribute("r",0);
  setOp(esnet.official,1);
  setOp(esnet.platesGroup,0);
  setOp(esnet.slicesGroup,0);
  setOp(esnet.sliceGuide,0);
  setOp(esnet.constGroup,0);
  setOp(esnet.irisGroup,0);
  setOp(esnet.spinGroup,0);
  setOp(esnet.registerGroup,0);
}
function setEsnetOfficialFull(){
  esnet.blueGroup.removeAttribute("clip-path");
  esnet.wipeRect.setAttribute("width",0);
  esnet.radialCircle.setAttribute("r",0);
  setOp(esnet.scanLine,0);
  setOp(esnet.netGroup,0);
  setOp(esnet.gridGroup,0);
  setOp(esnet.orbitsGroup,0);
  esnet.globeRect.setAttribute("width",420);
  esnet.wordRect.setAttribute("width",1029);
  setFillOp(esnet.blue,1);
  setFillOp(esnet.light,1);
  setOp(esnet.white,1);
  setOp(esnet.blueGhost,0);
  setOp(esnet.lightGhost,0);
  esnet.grayWrap.removeAttribute("transform");
  setOp(esnet.grayWrap,1);
}
function renderEsnetNew(u,style){
  const finalFade=u<0.5?1:1-smooth(phase(u,0.62,0.94));
  setEsnetOfficialFull();
  let officialOp=1;
  if(style===5){
    const settle=easeOutBack(phase(u,0.05,0.27));
    const wobble=(1-smooth(phase(u,0.20,0.32)))*3;
    const offsets=[[28,-20],[-26,22],[16,26]];
    for(let i=0;i<esnet.plateInners.length;i++){
      const [ox,oy]=offsets[i];
      const dx=ox*(1-settle)+Math.sin(u*34+i*2.1)*wobble;
      const dy=oy*(1-settle)+Math.cos(u*29+i*1.7)*wobble;
      esnet.plateInners[i].setAttribute("transform",`translate(${dx.toFixed(3)} ${dy.toFixed(3)})`);
    }
    setOp(esnet.platesGroup,smooth(phase(u,0.02,0.08))*(1-smooth(phase(u,0.28,0.36))));
    setOp(esnet.registerGroup,smooth(phase(u,0.02,0.09))*(1-smooth(phase(u,0.32,0.40))));
    const regS=lerp(1.14,1,easeOut(phase(u,0.04,0.28)));
    setTransform(esnet.registerGroup,0,0,regS,regS,lerp(-4,0,easeOut(phase(u,0.04,0.28))),960,540);
    officialOp=smooth(phase(u,0.28,0.40));
  }else if(style===6){
    const gather=easeOut(phase(u,0.06,0.26));
    const decorOut=1-smooth(phase(u,0.38,0.46));
    const nodeIn=smooth(phase(u,0.04,0.12))*decorOut;
    for(const n of esnet.constNodes){
      const local=easeOut(clamp(gather-n.delay*0.6));
      const x=lerp(n.start.x,n.target.x,local).toFixed(2);
      const y=lerp(n.start.y,n.target.y,local).toFixed(2);
      n.el.setAttribute("cx",x);
      n.el.setAttribute("cy",y);
      n.halo.setAttribute("cx",x);
      n.halo.setAttribute("cy",y);
      setOp(n.el,nodeIn);
      setOp(n.halo,nodeIn*0.16);
    }
    for(const l of esnet.constLinks){
      const lp=smooth(phase(u,0.06+l.delay,0.22+l.delay));
      l.el.style.strokeDashoffset=String(l.L*(1-lp));
      setOp(l.el,lp*l.opacity*decorOut);
    }
    setOp(esnet.constGroup,1);
    officialOp=smooth(phase(u,0.23,0.37));
  }else if(style===7){
    const grow=easeOut(phase(u,0.025,0.32));
    esnet.irisCircle.setAttribute("r",(920*grow).toFixed(2));
    esnet.motion.setAttribute("clip-path","url(#esnet-iris-clip)");
    const s=lerp(0.62,1,easeOut(phase(u,0.025,0.32)));
    setTransform(esnet.motion,0,0,s,s,0,960,540);
    setOp(esnet.irisGroup,smooth(phase(u,0.02,0.08))*(1-smooth(phase(u,0.32,0.42))));
    for(const ring of esnet.irisRings)ring.el.setAttribute("r",(ring.r*grow).toFixed(2));
    setTransform(esnet.irisTicks,0,0,1,1,u*160,960,540);
    officialOp=smooth(phase(u,0.05,0.14));
  }else if(style===8){
    const spin=easeInOut(phase(u,0.04,0.36));
    const sc=lerp(0.18,1,easeOutBack(phase(u,0.04,0.34)));
    const rot=-720*(1-spin);
    setTransform(esnet.motion,0,0,sc,sc,rot,960,540);
    setOp(esnet.spinGroup,smooth(phase(u,0.02,0.08))*(1-smooth(phase(u,0.32,0.42))));
    setTransform(esnet.spinGroup,0,0,1,1,-rot*0.55,960,540);
    officialOp=smooth(phase(u,0.05,0.14));
  }else if(style===9){
    const assemble=phase(u,0.04,0.34);
    for(let i=0;i<esnet.sliceInners.length;i++){
      const p=easeOut(clamp((assemble*1.32)-i*0.018));
      const dir=i%2?-1:1;
      const dx=dir*(190+((i*53)%110))*(1-p);
      const dy=((i%3)-1)*5*(1-p);
      esnet.sliceInners[i].setAttribute("transform",`translate(${dx.toFixed(3)} ${dy.toFixed(3)})`);
    }
    const runOp=smooth(phase(u,0.02,0.07))*(1-smooth(phase(u,0.32,0.42)));
    setOp(esnet.slicesGroup,runOp);
    setOp(esnet.sliceGuide,runOp*0.9);
    officialOp=smooth(phase(u,0.31,0.43));
  }
  if(u>=0.46){
    esnet.motion.removeAttribute("transform");
    esnet.motion.removeAttribute("clip-path");
    esnet.irisCircle.setAttribute("r",0);
    setOp(esnet.platesGroup,0);
    setOp(esnet.slicesGroup,0);
    setOp(esnet.sliceGuide,0);
    setOp(esnet.constGroup,0);
    setOp(esnet.irisGroup,0);
    setOp(esnet.spinGroup,0);
    setOp(esnet.registerGroup,0);
    officialOp=1;
  }
  setOp(esnet.official,officialOp*finalFade);
  esnet.lastGray=officialOp*finalFade;
  esnet.lastNet=0;
  esnet.lastBlue=officialOp*finalFade;
  esnet.lastLight=officialOp*finalFade;
  esnet.lastWord=officialOp*finalFade;
}
function renderESnet(u){
  if(esnetStyle!==0){renderEsnetVariant(u,esnetStyle);return;}
  resetEsnetDecor();
  esnet.blueGroup.removeAttribute("clip-path");
  esnet.wipeRect.setAttribute("width",0);
  esnet.radialCircle.setAttribute("r",0);
  setOp(esnet.gridGroup,0);setOp(esnet.orbitsGroup,0);setOp(esnet.scanLine,0);
  esnet.globeRect.setAttribute("width",420);
  const grayIn=smooth(phase(u,0.02,0.12));
  const grayOut=1-smooth(phase(u,0.86,0.96));
  const grayS=u<0.5?lerp(0.94,1,easeOut(phase(u,0.02,0.16))):1;
  setOp(esnet.grayWrap,grayIn*grayOut);
  setTransform(esnet.grayWrap,0,0,grayS,grayS,0,197,200);
  esnet.lastGray=grayIn*grayOut;
  const netIn=smooth(phase(u,0.03,0.08));
  const netOut=1-smooth(phase(u,0.24,0.32));
  setOp(esnet.netGroup,netIn*netOut*0.85);
  const netDraw=smooth(phase(u,0.03,0.16));
  for(let i=0;i<esnet.netPaths.length;i++){
    const p=esnet.netPaths[i],L=esnet.netLens[i];
    p.style.strokeDasharray=String(L);
    p.style.strokeDashoffset=String(L*(1-netDraw));
  }
  esnet.lastNet=netIn*netOut;
  const bo=u<0.5?smooth(phase(u,0.14,0.38)):1-smooth(phase(u,0.62,0.90));
  esnet.blueGhost.style.strokeDasharray=String(esnet.blueGhostLen);
  esnet.blueGhost.style.strokeDashoffset=String(esnet.blueGhostLen*(1-bo));
  setOp(esnet.blueGhost,u<0.5?(1-smooth(phase(u,0.38,0.46))):smooth(phase(u,0.60,0.66))*(1-smooth(phase(u,0.94,0.99))));
  const bf=u<0.5?smooth(phase(u,0.28,0.42)):1-smooth(phase(u,0.62,0.90));
  setFillOp(esnet.blue,bf);
  esnet.lastBlue=bf;
  const lo=u<0.5?smooth(phase(u,0.24,0.42)):1-smooth(phase(u,0.62,0.90));

  nrp.scanLine.setAttribute("x1",sx);nrp.scanLine.setAttribute("x2",sx);
  const scanOp=smooth(phase(u,0.10,0.14))*(1-smooth(phase(u,0.34,0.40)));
  setOp(nrp.scanGlow,scanOp*0.35);
  setOp(nrp.scanLine,scanOp);
  const guideIn=smooth(phase(u,0.02,0.08));

  const guideRev=smooth(phase(u,0.60,0.66))*(1-smooth(phase(u,0.86,0.94)));

  setOp(nrp.gridGroup,gridOp*0.8);

  for(const g of nrp.grid)g.el.setAttribute("x2",(g.x+g.len*gridDraw).toFixed(2));
  const nodeOp=Math.max(smooth(phase(u,0.04,0.12))*guideOut,smooth(phase(u,0.62,0.70))*(1-smooth(phase(u,0.86,0.94))));
  setOp(nrp.nodesGroup,nodeOp);
  for(const n of nrp.nodes){
    const p=easeOutBack(phase(u,0.04+n.delay,0.12+n.delay));

  const pulseOp=Math.max(smooth(phase(u,0.08,0.14))*(1-smooth(phase(u,0.34,0.42))),smooth(phase(u,0.62,0.68))*(1-smooth(phase(u,0.88,0.96))));
  setOp(nrp.pulsesGroup,pulseOp);

  }
  const ringP=u<0.5?easeOut(phase(u,0.18,0.38)):1-easeOut(phase(u,0.68,0.86));

function resetActVariation(group){
  group.removeAttribute("transform");
  group.removeAttribute("clip-path");
}
function applyActVariation(group,actId,u,vi){
  resetActVariation(group);
  if(actId==="esnet"||vi===0||u<0.02||u>=0.46)return;
  if(vi===1){
    const p=easeInOut(phase(u,0.02,0.44));
    variation.irisCircle.setAttribute("r",(1200*p).toFixed(2));
    group.setAttribute("clip-path","url(#variation-iris)");
    const s=lerp(0.84,1,easeOut(phase(u,0.02,0.44)));
    setTransform(group,0,0,s,s,0,960,540);
  }else if(vi===2){
    const p=easeInOut(phase(u,0.03,0.38));
    const s=lerp(0.12,1,easeOutBack(phase(u,0.03,0.36)));
    const rot=-540*(1-p);
    setTransform(group,0,0,s,s,rot,960,540);
  }else if(vi===3){
    const p=easeInOut(phase(u,0.02,0.44));
    const y=1080*(1-p);
    variation.scanRect.setAttribute("y",y.toFixed(2));
    variation.scanRect.setAttribute("height",(1080-y).toFixed(2));
    group.setAttribute("clip-path","url(#variation-scan)");

    variation.scanLine.setAttribute("y1",y.toFixed(2));
    variation.scanLine.setAttribute("y2",y.toFixed(2));

  }
}

  {id:"nrp",start:0,group:document.getElementById("act-nrp"),render:renderNRP}
];
function renderAll(t){
  setOp(variation.overlay,0);
  for(const a of ACTS){

    if(active){
      a.render(clamp(u));
      if(a.id!=="esnet")applyActVariation(a.group,a.id,clamp(u),variationByAct[a.id]);

function activeActIndex(t){return Math.min(Math.max(Math.floor(t/ACT_DUR),0),ACTS.length-1)}
function getVariationForAct(i){const id=ACTS[i].id;return id==="esnet"?esnetStyle:variationByAct[id]}
function setVariationForAct(i,v){const id=ACTS[i].id;if(id==="esnet")esnetStyle=v;else variationByAct[id]=v}
function updateVariationUI(i){
  i=Math.min(Math.max(i,0),ACTS.length-1);
  if(i!==variationActIndex){
    variationActIndex=i;
    const names=VARIATION_NAMES[ACTS[i].id];
    variationSelect.innerHTML=names.map((n,k)=>`<option value="${k}">${n}</option>`).join("");
  }
  variationSelect.value=String(getVariationForAct(i));
}
function previewVariation(v){
  const i=variationActIndex>=0?variationActIndex:0;
  setVariationForAct(i,v);
  chapterMode=true;
  chapterEnd=ACTS[i].start+ACT_DUR;
  setTime(ACTS[i].start);
  play();
}
variationSelect.addEventListener("change",()=>previewVariation(parseInt(variationSelect.value,10)));
ui.chapters.forEach((b,i)=>b.addEventListener("click",()=>seekAct(i)));
ui.track.addEventListener("click",e=>{const r=ui.track.getBoundingClientRect();setTime(clamp((e.clientX-r.left)/r.width)*TOTAL)});
document.getElementById("stage-frame").addEventListener("click",e=>{if(e.target.closest("#ui"))return;toggle()});
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA")return;
  if(e.code==="Space"){e.preventDefault();toggle()}
  else if(e.key==="1")seekAct(0);
  else if(e.key==="2")seekAct(1);
  else if(e.key==="3")seekAct(2);
  else if(e.key==="4")seekAct(3);
  else if(e.key==="5")seekAct(4);
  else if(e.key==="6")seekAct(5);
  else if(e.key==="7")seekAct(6);
  else if(e.key==="8")seekAct(7);
  else if(e.key==="r"||e.key==="R")playAll();
  else if(e.key==="l"||e.key==="L")toggleLoop();
  else if(e.key==="f"||e.key==="F")toggleFullscreen();
  else if(e.key==="h"||e.key==="H")toggleClean();
  else if(e.key==="ArrowLeft"){e.preventDefault();setTime(time-1)}
  else if(e.key==="ArrowRight"){e.preventDefault();setTime(time+1)}
  else if(e.key==="Escape"&&document.body.classList.contains("clean"))toggleClean();
});
function readHash(){
  const p=new URLSearchParams(location.hash.slice(1));
  if(p.has("clean"))document.body.classList.add("clean");
  if(p.has("s")){const i=parseInt(p.get("s"),10);if(i>=0&&i<10)esnetStyle=i;}
  if(p.has("t")){
    const t=parseFloat(p.get("t"));
    if(Number.isFinite(t)){playing=false;setTime(t)}
  }
  if(p.has("act")){
    const i=parseInt(p.get("act"),10);
    if(i>=0&&i<ACTS.length){playing=false;setTime(ACTS[i].start)}
  }
  if(p.has("var")){
    const vi=parseInt(p.get("var"),10);
    const ai=p.has("act")?parseInt(p.get("act"),10):activeActIndex(time);
    if(ai>=0&&ai<ACTS.length){
      const names=VARIATION_NAMES[ACTS[ai].id];
      if(vi>=0&&vi<names.length){
        setVariationForAct(ai,vi);
        playing=false;
        setTime(ACTS[ai].start);
      }
    }
  }
}
function tick(now){
  if(window.__stopped)return;
  const dt=Math.min(0.05,(now-last)/1000);
  last=now;
  if(playing){
    time+=dt;
    if(chapterMode&&chapterEnd!==null&&time>=chapterEnd){
      time=chapterEnd;
      playing=false;
      chapterMode=false;
      chapterEnd=null;
    }else if(time>=TOTAL){
      if(loop&&!chapterMode)time=time%TOTAL;
      else{time=TOTAL;playing=false}
    }
  }
  renderAll(time);
  updateUI(time);
  requestAnimationFrame(tick);
}
renderAll(0);
updateUI(0);
readHash();
if(matchMedia("(prefers-reduced-motion: reduce)").matches&&!location.hash){playing=false;setTime(4.3)}
window.__seek=setTime;
window.__play=play;
window.__pause=pause;
window.__state=()=>({time,playing,loop,chapterMode,esnetStyle,variation:getVariationForAct(activeActIndex(time)),variations:{...variationByAct,esnet:esnetStyle}});
window.__stop=()=>{window.__stopped=true};
window.__esnetRibbonState=()=>({gray:esnet.lastGray,net:esnet.lastNet,blue:esnet.lastBlue,light:esnet.lastLight,word:esnet.lastWord});
window.__esnetHoldOpacity=()=>esnet.lastWord;
window.__inmonState=()=>({redFill:parseFloat(inmon.redArc.getAttribute("fill-opacity")||"0"),wordWidth:parseFloat(inmon.wordClipRect.getAttribute("width")||"0")/3378,dot:parseFloat(inmon.redDot.getAttribute("opacity")||"0"),official:parseFloat(inmon.official.getAttribute("opacity")||"1")});
window.__nrpState=()=>({blue:parseFloat(nrp.blue?.[0]?.getAttribute("fill-opacity")||"0"),gray:parseFloat(nrp.grayWord?.getAttribute("opacity")||"0"),clip:parseFloat(nrp.grayClipRect?.getAttribute("width")||"0")/2192,ghost:parseFloat(nrp.blueGhosts?.[0]?.el.getAttribute("opacity")||"0"),scan:parseFloat(nrp.scanLine?.getAttribute("opacity")||"0")});
requestAnimationFrame(tick);
</script>
</body>
